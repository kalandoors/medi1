version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"   # Expose NGINX on http://localhost:8080
    volumes:
      - ./html:/usr/share/nginx/html:ro   # Serve your custom HTML files
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Optional custom NGINX config
    restart: always
